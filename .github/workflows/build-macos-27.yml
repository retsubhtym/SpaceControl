name: Build macOS 27

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release build
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch app assets from LFS
        run: git lfs pull --include "SpaceControl/Assets.xcassets/**"

      - name: Verify Xcode and macOS SDK
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: ${sdk_version}"
          [[ "${sdk_version}" == 27.* ]]

      - name: Build release app
        run: |
          xcodebuild \
            -project SpaceControl.xcodeproj \
            -scheme SpaceControl \
            -configuration Release \
            -sdk macosx27.0 \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/SpaceControl.app \
            SpaceControl-macOS-27.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SpaceControl-macOS-27
          path: SpaceControl-macOS-27.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download built app
        uses: actions/download-artifact@v4
        with:
          name: SpaceControl-macOS-27
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"

          gh release create "${RELEASE_TAG}" \
            "release/SpaceControl-macOS-27.zip#SpaceControl for macOS 27" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "SpaceControl ${version}" \
            --generate-notes
